<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Checklist — Claude Agency</title>
<style>
  /* Meme paire de polices et memes tokens de couleur que templates/julien-agency.html
     (charte Claude Agency verifiee le 11/09 et 24/09/2026) -- document A4 autonome
     (page unique, pas un carrousel), pour un lead magnet envoye en message prive. */
  @font-face {
    font-family: 'Bricolage Grotesque';
    font-style: normal;
    font-weight: 200 800;
    font-display: block;
    src: url({{FONT_BRICOLAGE_DATAURI}}) format('woff2');
  }
  @font-face {
    font-family: 'Schibsted Grotesk';
    font-style: normal;
    font-weight: 400 900;
    font-display: block;
    src: url({{FONT_SCHIBSTED_DATAURI}}) format('woff2');
  }

  :root {
    --bg: #FBF7F1;
    --bg-sombre: #934E3A;
    --ink: #2B2724;
    --muted: #7A6E60;
    --accent-deco: #CC785C;
    --accent-text: #934E3A;
    --ring: #CC785C;
    --cream: #FBF7F1;
    --hairline: #2B272414;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--bg); }
  @page { size: 210mm 297mm; margin: 0; }

  .page, .page * {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    color-adjust: exact;
  }

  /* Canevas A4 a 96dpi (793.7 x 1122.5px), meme logique que le canevas fixe
     1080x1350 des diapos carrousel -- coherence pixel-a-pixel entre l'ecran
     de verification et le PDF imprime. */
  .page {
    width: 794px;
    min-height: 1123px;
    background: var(--bg);
    font-family: 'Schibsted Grotesk', 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 40px 56px 32px;
  }

  .topbar { display: flex; align-items: center; margin-bottom: 20px; }

  .brandmark {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    background: var(--cream);
    padding: 6px 18px 6px 6px;
    border-radius: 999px;
    box-shadow: 0 2px 10px rgba(43, 39, 36, 0.12);
  }

  .logo-img { display: block; width: 34px; height: 34px; }

  .brandname {
    font-family: 'Schibsted Grotesk', sans-serif;
    font-weight: 700;
    font-size: 19px;
    color: var(--ink);
  }

  .accent-rule {
    width: 48px;
    height: 5px;
    border-radius: 3px;
    background: var(--accent-deco);
    margin-bottom: 16px;
  }

  .eyebrow {
    margin: 0 0 8px 0;
    font-family: 'Schibsted Grotesk', sans-serif;
    font-weight: 700;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--accent-text);
  }

  h1.title {
    margin: 0 0 12px 0;
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 800;
    font-size: 32px;
    line-height: 1.12;
    letter-spacing: -0.01em;
    color: var(--ink);
    max-width: 680px;
  }

  .accent-mot { color: var(--accent-text); }

  .intro {
    margin: 0 0 18px 0;
    font-family: 'Schibsted Grotesk', sans-serif;
    font-weight: 400;
    font-size: 13.5px;
    line-height: 1.45;
    color: var(--muted);
    max-width: 660px;
  }

  .checklist { margin: 0 0 16px 0; padding: 0; list-style: none; }

  .checklist-item {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    margin-bottom: 11px;
  }

  .check-bubble {
    flex: none;
    width: 24px;
    height: 24px;
    border-radius: 999px;
    background: var(--accent-text);
    color: var(--cream);
    font-family: 'Schibsted Grotesk', sans-serif;
    font-size: 13px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 1px;
  }

  .item-body { flex: 1 1 auto; min-width: 0; }

  .item-titre {
    margin: 0 0 2px 0;
    font-family: 'Schibsted Grotesk', sans-serif;
    font-weight: 700;
    font-size: 15px;
    line-height: 1.3;
    color: var(--ink);
  }

  .item-exemple {
    margin: 0;
    font-family: 'Schibsted Grotesk', sans-serif;
    font-weight: 400;
    font-size: 12.5px;
    line-height: 1.4;
    color: var(--muted);
  }

  .item-exemple strong { color: var(--ink); font-weight: 600; }

  .source-ligne {
    margin: 0 0 10px 0;
    font-family: 'Schibsted Grotesk', sans-serif;
    font-weight: 500;
    font-size: 11.5px;
    color: var(--muted);
  }

  .hairline { height: 1px; background: var(--ink); opacity: 0.1; margin-bottom: 14px; }

  .footer { display: flex; align-items: center; justify-content: space-between; gap: 24px; }

  .auteur { display: flex; align-items: center; gap: 14px; min-width: 0; }

  .photo-img {
    display: block;
    width: 44px;
    height: 44px;
    border-radius: 999px;
    object-fit: cover;
    border: 3px solid var(--ring);
    flex: none;
  }

  .auteur-texte { min-width: 0; }

  .auteur-nom {
    font-family: 'Schibsted Grotesk', sans-serif;
    font-weight: 700;
    font-size: 14px;
    color: var(--ink);
  }

  .auteur-role {
    margin-top: 2px;
    font-family: 'Schibsted Grotesk', sans-serif;
    font-weight: 400;
    font-size: 12px;
    color: var(--muted);
  }

  .cta-ligne {
    text-align: right;
    font-family: 'Schibsted Grotesk', sans-serif;
    font-weight: 500;
    font-size: 12.5px;
    line-height: 1.4;
    color: var(--muted);
    max-width: 300px;
  }
</style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div class="brandmark">
        <img class="logo-img" src="{{LOGO_DATAURI}}" alt="">
        <span class="brandname">{{NOM_MARQUE}}</span>
      </div>
    </div>
    <div class="accent-rule"></div>
    <p class="eyebrow">{{EYEBROW}}</p>
    <h1 class="title">{{TITRE_HTML}}</h1>
    <p class="intro">{{INTRO}}</p>
    <ul class="checklist">
      {{ITEMS_HTML}}
    </ul>
    <div class="footer-wrap">
      <p class="source-ligne">{{SOURCE_LIGNE}}</p>
      <div class="hairline"></div>
      <div class="footer">
        <div class="auteur">
          <img class="photo-img" src="{{PHOTO_DATAURI}}" alt="">
          <div class="auteur-texte">
            <div class="auteur-nom">{{AUTEUR_NOM}}</div>
            <div class="auteur-role">{{AUTEUR_ROLE}}</div>
          </div>
        </div>
        <div class="cta-ligne">{{CTA_LIGNE}}</div>
      </div>
    </div>
  </div>
</body>
</html>
