  :root {
    --bg: #FBF7F1;
    --ink: #2B2724;
    --muted: #584F45;
    --accent-deco: #C6B49A;
    --accent-text: #9C503A;
    --hairline: #2B272414;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
  }

  body {
    background: #ECE7DD;
  }

  @page {
    size: 1080px 1350px;
    margin: 0;
  }

  .slide, .slide * {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    color-adjust: exact;
  }

  /* -----------------------------------------------------------------
     Gabarit de diapo carrousel LinkedIn — Claude Partners
     Dimensions fixes 1080x1350 (format document LinkedIn 4:5).

     Variables a injecter (remplacement de texte simple, style {{ }}) :
       {{TITRE}}   — titre de la diapo (Fraunces, >=64px)
       {{TEXTE}}   — texte de soutien, optionnel (Inter, >=40px)
       {{NUMERO}}  — numero de diapo, ex. "01", "02"...
       {{ROLE}}    — "hook" (diapo 1, sans logo, avec fleche)
                         ou "contenu" (les suivantes, avec logo, sans fleche)
     ------------------------------------------------------------------ */

  .slide {
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    background: var(--bg);
    font-family: 'Inter', 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    padding: 96px;
  }

  .accent-rule {
    flex: none;
    width: 64px;
    height: 6px;
    border-radius: 3px;
    background: var(--accent-deco);
  }

  .content {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 0;
  }

  .title {
    margin: 0;
    font-family: 'Fraunces Display', Georgia, serif;
    font-weight: 600;
    font-size: 76px;
    line-height: 1.09;
    letter-spacing: -0.01em;
    color: var(--ink);
    max-width: 888px;
  }

  .body-text {
    margin: 40px 0 0 0;
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 44px;
    line-height: 1.45;
    color: var(--muted);
    max-width: 760px;
  }

  .body-text:empty {
    display: none;
    margin: 0;
  }

  .footer-wrap {
    flex: none;
  }

  .hairline {
    height: 1px;
    background: var(--ink);
    opacity: 0.08;
    margin-bottom: 40px;
  }

  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 28px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent-text);
  }

  .logo .dot {
    width: 10px;
    height: 10px;
    border-radius: 3px;
    background: var(--accent-deco);
    flex: none;
  }

  .swipe-hint {
    display: none;
    align-items: center;
    gap: 14px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 28px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent-text);
  }

  .swipe-hint svg {
    width: 34px;
    height: 34px;
    display: block;
  }

  .pagenum {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 28px;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
    color: var(--accent-text);
  }

  /* Diapo 1 ("hook") : pas de logo, fleche visible, titre plus grand (effet affiche) */
  .slide[data-role="hook"] .logo { display: none; }
  .slide[data-role="hook"] .swipe-hint { display: flex; }
  .slide[data-role="hook"] .title { font-size: 88px; line-height: 1.05; }

  /* Image seule (post a une seule image, pas de carrousel feuilletable) : masque
     les reperes qui n'ont de sens que dans un document multi-pages. Parametre
     explicite {{CONTEXTE}}, jamais devine depuis le nombre de diapos -- voir
     generer-images.js (genererImageCouverture). */
  .slide[data-contexte="image-seule"] .swipe-hint,
  .slide[data-contexte="image-seule"] .pagenum { display: none; }
</style>
</head>
<body>
<!-- SLIDE:BEGIN -->
  <div class="slide" data-role="{{ROLE}}" data-contexte="{{CONTEXTE}}">
    <div class="accent-rule"></div>
    <div class="content">
      <h1 class="title">{{TITRE}}</h1>
      <p class="body-text">{{TEXTE}}</p>
    </div>
    <div class="footer-wrap">
      <div class="hairline"></div>
      <div class="footer">
        <div class="logo"><span class="dot"></span>Claude Partners</div>
