name: Aucune cle d'API dans le depot

# Ce depot est public. Cette Action refuse tout push ou toute pull request
# qui introduit une cle d'API. Elle double le hook pre-commit local
# (scripts/installer-garde-fou.sh), que chacun n'installe pas forcement.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scanner l'arbre courant
        run: bash scripts/scan-secrets.sh

      - name: Scanner tout l'historique
        run: |
          set -u
          ECHEC=0
          for sha in $(git rev-list --all); do
            TROUVES=$(git grep -l -I -E 'apify_api_[A-Za-z0-9]{30,}|sk-or-v1-[a-f0-9]{40,}|ntn_[A-Za-z0-9]{30,}|secret_[A-Za-z0-9]{35,}|sk-ant-[A-Za-z0-9_-]{40,}|sk-proj-[A-Za-z0-9_-]{40,}|gh[pousr]_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16}|xox[baprs]-[0-9A-Za-z-]{20,}' "$sha" 2>/dev/null \
              | grep -v 'scan-secrets' || true)
            if [ -n "$TROUVES" ]; then
              echo "Commit $sha :"
              echo "$TROUVES" | sed 's/^/  /'
              ECHEC=1
            fi
          done
          if [ "$ECHEC" -ne 0 ]; then
            echo ""
            echo "Une cle est presente dans l'historique. La REVOQUER sur le service"
            echo "concerne : la retirer du depot ne la desactive pas."
            exit 1
          fi
          echo "Historique propre ($(git rev-list --all --count) commits)."
